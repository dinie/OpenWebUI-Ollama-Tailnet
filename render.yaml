# Render Blueprint — deploy via: Dashboard → New → Blueprint → select this repo.
# Same Dockerfile and start.sh as the Fly.io deployment; Render injects its own
# PORT, which Open WebUI honours (do NOT set PORT here).
#
# Persistence model: no disk (free tier compatible). Chat history, users and
# settings live in PostgreSQL via DATABASE_URL. Uploads, the RAG vector store
# and tailscaled state are ephemeral — they reset on each restart/redeploy
# (use an *ephemeral* Tailscale auth key so departed nodes clean themselves up).
services:
  - type: web
    name: openwebui
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Start command: the image CMD (/start.sh) — initialises tailscaled in
    # userspace-networking mode, binds app egress to its localhost:1055 proxy
    # via runtime-exported HTTP(S)_PROXY, then bootstraps Open WebUI.
    plan: free             # sleeps after ~15 min idle (tailnet node drops offline);
                           # switch to "starter" for 24/7 tailnet reachability
    region: singapore      # closest Render region to Australia
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false        # postgresql://user:pass@host:5432/dbname
                           # (Render managed PG, Neon, Supabase, ...)
      - key: TAILSCALE_AUTHKEY
        sync: false        # prompted at deploy time — never commit it.
                           # Use an EPHEMERAL, reusable key: without a disk the
                           # node loses its identity on every restart.
      - key: TAILSCALE_HOSTNAME
        value: openwebui-render  # distinct from the Fly node ('openwebui')
      - key: WEBUI_SECRET_KEY
        generateValue: true
      # HTTP(S)_PROXY is exported by start.sh at container start, NOT defined as
      # an env var — Render exposes env vars to the Docker build, where a
      # localhost:1055 proxy breaks build-time package installs (apt/curl).
      - key: OLLAMA_BASE_URL
        value: https://ollama.tailnet-eeb1.ts.net  # local Ollama via tailscale serve
      # Stay under the 512MB free-plan cap: offload RAG embeddings to the tailnet
      # Ollama instead of loading sentence-transformers/PyTorch in this container.
      # Requires an embedding model in Ollama:
      #   docker compose exec ollama ollama pull nomic-embed-text
      - key: RAG_EMBEDDING_ENGINE
        value: ollama
      - key: RAG_EMBEDDING_MODEL
        value: nomic-embed-text
      - key: OPENAI_API_KEY
        sync: false

# Alternative: let Render provision a managed Postgres instead of supplying
# DATABASE_URL yourself. Note: Render's FREE Postgres expires after 30 days
# (Neon/Supabase free tiers don't). Uncomment and change the DATABASE_URL
# env var above to `fromDatabase: { name: openwebui-db, property: connectionString }`.
# databases:
#   - name: openwebui-db
#     plan: free
#     databaseName: openwebui
#     user: openwebui
